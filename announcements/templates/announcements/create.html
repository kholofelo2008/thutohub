{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Announcement{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4>Create New Announcement</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success w-100 mt-3">Post Announcement</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
