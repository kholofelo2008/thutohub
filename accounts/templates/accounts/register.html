{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block title %}Register - ThutoHub{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0">Join ThutoHub</h3>
                    <p class="mb-0">Choose your role and get started</p>
                </div>
                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <!-- Role selection (if not already in form) -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">I am a:</label>
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="form-check card p-3 border h-100">
                                        <input class="form-check-input" type="radio" name="role" id="parent" value="parent" checked>
                                        <label class="form-check-label d-block text-center" for="parent">
                                            <i class="bi bi-people fs-1 mb-2 d-block"></i> Parent
                                        </label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check card p-3 border h-100">
                                        <input class="form-check-input" type="radio" name="role" id="learner" value="learner">
                                        <label class="form-check-label d-block text-center" for="learner">
                                            <i class="bi bi-book fs-1 mb-2 d-block"></i> Learner
                                        </label>
                                    </div>
                                </div>
                                <!-- Add teacher/admin if self-registration allowed, else hide -->
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">Create Account</button>
                    </form>
                    <p class="text-center mt-4">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
